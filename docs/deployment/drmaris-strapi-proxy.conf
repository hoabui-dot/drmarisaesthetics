# Install as /etc/nginx/snippets/drmaris-strapi-proxy.conf and include from
# each Strapi location in nginx-demo-drmaris-shared-origin.conf.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Transitional compatibility for the currently deployed Strapi bundle. The
# permanent fix is rebuilding it with STRAPI_ADMIN_BACKEND_URL set to this
# public HTTPS origin. Disable compression so Nginx can safely rewrite assets.
proxy_redirect http://103.75.183.34:22345/ https://demo-drmaris.ddns.net/;
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter_types application/javascript text/javascript application/json;
sub_filter 'http://103.75.183.34:22345' 'https://demo-drmaris.ddns.net';
sub_filter 'strapi-VNa_fJIs.js' 'strapi-VNa_fJIs.js?backend=shared-origin-20260921';
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
