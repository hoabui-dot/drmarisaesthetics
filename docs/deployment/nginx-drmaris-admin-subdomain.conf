# DR. MARIS production reverse proxy with Strapi on a dedicated subdomain.
#
# Frontend: https://drmarisaesthetics.com       -> 127.0.0.1:2234
# Strapi:   https://admin.drmarisaesthetics.com -> 127.0.0.1:22345
#
# Install the clean proxy snippet from
# docs/deployment/drmaris-strapi-subdomain-proxy.conf as:
# /etc/nginx/snippets/drmaris-strapi-subdomain-proxy.conf

server {
    listen 80;
    listen [::]:80;
    server_name drmarisaesthetics.com www.drmarisaesthetics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drmarisaesthetics.com www.drmarisaesthetics.com;

    ssl_certificate /etc/letsencrypt/live/drmarisaesthetics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drmarisaesthetics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:2234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.drmarisaesthetics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.drmarisaesthetics.com;

    ssl_certificate /etc/letsencrypt/live/admin.drmarisaesthetics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.drmarisaesthetics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location = / {
        return 302 /admin/auth/login;
    }

    location / {
        proxy_pass http://127.0.0.1:22345;
        include /etc/nginx/snippets/drmaris-strapi-subdomain-proxy.conf;
    }
}
