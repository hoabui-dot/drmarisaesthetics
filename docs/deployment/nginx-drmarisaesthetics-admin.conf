# Deprecated: shared-origin/legacy Strapi Admin proxy.
# Do not install this file for the current production setup. Use
# nginx-drmaris-admin-subdomain.conf instead; it keeps the website on
# drmarisaesthetics.com and Strapi on admin.drmarisaesthetics.com.
#
# Strapi Admin reverse proxy for drmarisaesthetics.com.
# The Strapi service remains on the existing NetBird address; public IP changes
# therefore require only DNS/Nginx changes, not a CMS rebuild or reseed.
server {
    listen 80;
    listen [::]:80;
    server_name drmarisaesthetics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drmarisaesthetics.com;

    ssl_certificate /etc/letsencrypt/live/drmarisaesthetics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drmarisaesthetics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # This CMS already has an administrator. Go directly to the login route so
    # the stale server-side setup redirect cannot send editors to registration.
    location = / {
        return 302 /admin/auth/login;
    }

    location = /admin {
        return 302 /admin/auth/login;
    }

    location = /admin/ {
        return 302 /admin/auth/login;
    }

    location = /admin/auth/register-admin {
        return 302 /admin/auth/login;
    }

    location / {
        proxy_pass http://100.82.195.220:22345;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # The currently deployed Strapi Admin bundle still embeds the legacy
        # HTTP backend URL. Rewrite redirects and textual Admin assets to this
        # HTTPS origin until STRAPI_ADMIN_BACKEND_URL is updated and rebuilt.
        proxy_redirect http://103.75.183.34:22345/ https://drmarisaesthetics.com/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json;
        sub_filter 'http://103.75.183.34:22345' 'https://drmarisaesthetics.com';
        sub_filter 'strapi-VNa_fJIs.js' 'strapi-VNa_fJIs.js?backend=drmarisa-https-fix4';
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
