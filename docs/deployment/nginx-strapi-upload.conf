# Apply this directive inside the server block that proxies
# 103.75.183.34:22345 to the Strapi container.
#
# Strapi's application parser is configured for 50 MB in
# strapi-cms/config/middlewares.ts. The proxy must be at least as large.

client_max_body_size 50m;

