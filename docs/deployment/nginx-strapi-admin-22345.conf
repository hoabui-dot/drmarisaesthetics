# Temporary compatibility reverse proxy for Strapi Admin while the CMS admin
# bundle still contains STRAPI_ADMIN_BACKEND_URL=http://103.75.183.34:22345.
# The supported long-term fix is to rebuild Strapi Admin with the new public URL.
server {
    listen 22345;
    listen [::]:22345;
    server_name _;

    client_max_body_size 50m;

    # This CMS already has an administrator; open the login route directly.
    location = / {
        return 302 /admin/auth/login;
    }

    location = /admin {
        return 302 /admin/auth/login;
    }

    location = /admin/ {
        return 302 /admin/auth/login;
    }

    location = /admin/auth/register-admin {
        return 302 /admin/auth/login;
    }

    location / {
        proxy_pass http://100.82.195.220:22345;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Rewrite stale Location headers and the same origin embedded in the
        # compiled Admin JavaScript. Disable upstream compression so sub_filter
        # can safely replace the literal URL in textual responses.
        proxy_redirect http://103.75.183.34:22345/ http://103.195.236.32:22345/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json;
        sub_filter 'http://103.75.183.34:22345' 'http://103.195.236.32:22345';
        sub_filter 'strapi-VNa_fJIs.js' 'strapi-VNa_fJIs.js?backend=ip-fix4';
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
