# Serve the Next.js website at / and Strapi Admin/API routes on the same HTTPS
# origin. Strapi itself remains on the private NetBird network.
server {
    listen 80;
    listen [::]:80;
    server_name demo-drmaris.ddns.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo-drmaris.ddns.net;

    ssl_certificate /etc/letsencrypt/live/demo-drmaris.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-drmaris.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Strapi Admin UI and all built-in/plugin Admin API calls share the public
    # origin. This avoids browser CORS and mixed-content requests entirely.
    location = /admin {
        proxy_pass http://100.82.195.220:22345;
        include /etc/nginx/snippets/drmaris-strapi-proxy.conf;
    }

    location ^~ /admin/ {
        proxy_pass http://100.82.195.220:22345;
        include /etc/nginx/snippets/drmaris-strapi-proxy.conf;
    }

    # Strapi plugin APIs are rooted outside /admin in Strapi v5.
    location ~ ^/(content-manager|content-type-builder|i18n|upload|users-permissions|seo-manager|backup-manager|docx-importer|preview-button|guided-tour-meta|license-limit-information|information)(/|$) {
        proxy_pass http://100.82.195.220:22345;
        include /etc/nginx/snippets/drmaris-strapi-proxy.conf;
    }

    # Public Strapi SEO endpoints used by the frontend. Other /api/* requests
    # (contact, booking, revalidation, etc.) continue to Next.js below.
    location ^~ /api/seo/ {
        proxy_pass http://100.82.195.220:22345;
        include /etc/nginx/snippets/drmaris-strapi-proxy.conf;
    }

    # Strapi media URLs must resolve on the same public host as Admin.
    location ^~ /uploads/ {
        proxy_pass http://100.82.195.220:22345;
        include /etc/nginx/snippets/drmaris-strapi-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:2234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
