      NEXTJS_URL: https://nhakhoaquoctesaigon.com
    volumes:
      - strapi_uploads:/opt/app/public/uploads
      - strapi_cache:/opt/app/.cache
    ports:
      - "1337:1337"
    networks:
      - dental-network-prod
    healthcheck:
      test:
        [ 
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:1337/_health', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 204 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: dental-postgres-prod
    restart: unless-stopped
    ports:
      - "51235:5432"
    environment:
      POSTGRES_DB: dental_cms_strapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dental-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
