version: "3.8"

services:
  smilux-strapi:
    build:
      context: ./strapi-cms
      dockerfile: Dockerfile
      args:
        STRAPI_ADMIN_BACKEND_URL: http://100.68.50.41:1337
    image: vanhoadotbui2628/dental_cms:1.0.0
    platform: linux/amd64
    container_name: dental-strapi
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_SCHEMA: public

      # Secrets
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}

      # URLs
      PUBLIC_URL: ${STRAPI_PUBLIC_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # Internal Docker URL; localhost inside Strapi points back to Strapi itself.
      NEXTJS_URL: http://smilux-frontend:3000
      PREVIEW_SECRET: ${NEXT_PREVIEW_SECRET}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
      # Cloudflare tunnel — hostname only (no https://), used by allowedHosts + CORS
      CLOUDFLARE_TUNNEL_HOST: ${CLOUDFLARE_TUNNEL_HOST}

    volumes:
      - strapi_uploads:/opt/app/public/uploads
      - strapi_cache:/opt/app/.cache

    ports:
      - "${STRAPI_PORT}:1337"

    networks:
      - dental-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:1337/_health', (r) => {process.exit(r.statusCode >= 200 && r.statusCode < 300 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  smilux-frontend:
    build:
      context: ./dental-frontend
      dockerfile: Dockerfile
      # ── Build-time ONLY ─────────────────────────────────────────────────────
      # Only NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
      # Server-side vars (STRAPI_URL, SMTP_*, etc.) go in environment below.
      # ────────────────────────────────────────────────────────────────────────
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        NEXT_PUBLIC_STRAPI_API_TOKEN: ${NEXT_PUBLIC_STRAPI_API_TOKEN}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    platform: linux/amd64
    image: vanhoadotbui2628/dental_frontend:2.0.0
    container_name: dental-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
      NEXT_PUBLIC_STRAPI_API_TOKEN: ${NEXT_PUBLIC_STRAPI_API_TOKEN}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      STRAPI_URL: ${STRAPI_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      NEXT_PREVIEW_SECRET: ${NEXT_PREVIEW_SECRET}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_TO_ADMIN: ${EMAIL_TO_ADMIN}
      EMAIL_TO_STAFF: ${EMAIL_TO_STAFF}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_RETRY_ATTEMPTS: ${EMAIL_RETRY_ATTEMPTS}
      EMAIL_RETRY_DELAY: ${EMAIL_RETRY_DELAY}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - dental-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
    driver: local
    name: dental-postgres-data

  strapi_uploads:
    driver: local
    name: dental-strapi-uploads

  strapi_cache:
    driver: local
    name: dental-strapi-cache
networks:
  dental-network:
    driver: bridge
    name: dental-network
